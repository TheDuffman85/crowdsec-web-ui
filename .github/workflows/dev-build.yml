name: Dev Build

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'screenshots/*'
      - '.gitignore'
      - 'reset-dev-branch.sh'
      - 'run.sh'
    branches:
      - dev
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at 00:00 UTC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.18.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify project
        run: pnpm run verify

      - name: Calculate dev version
        id: version
        run: |
          BUILD_NUMBER=$(date -u +'%Y%m%d%H%M')
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT
          echo "Dev build: dev-${BUILD_NUMBER}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=raw,value=dev-${{ steps.version.outputs.build_number }}

      - name: Extract metadata for load-test Docker image
        id: loadtest_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=loadtest

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_COMMIT_HASH=${{ steps.version.outputs.sha8 }}
            VITE_BUILD_DATE=${{ steps.version.outputs.date }}
            VITE_REPO_URL=${{ github.server_url }}/${{ github.repository }}
            VITE_BRANCH=dev
            VITE_VERSION=${{ steps.version.outputs.build_number }}
            DOCKER_IMAGE_REF=${{ github.repository }}

      - name: Build and push load-test Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          target: loadtest
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.loadtest_meta.outputs.tags }}
          labels: ${{ steps.loadtest_meta.outputs.labels }}
          build-args: |
            VITE_COMMIT_HASH=${{ steps.version.outputs.sha8 }}
            VITE_BUILD_DATE=${{ steps.version.outputs.date }}
            VITE_REPO_URL=${{ github.server_url }}/${{ github.repository }}
            VITE_BRANCH=dev
            VITE_VERSION=${{ steps.version.outputs.build_number }}
            DOCKER_IMAGE_REF=${{ github.repository }}

      - name: Cleanup old dev images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f  # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: ${{ github.event.repository.name }}
          delete-tags: dev-*
          exclude-tags: dev,latest,20*
          keep-n-tagged: 3
          delete-untagged: true
